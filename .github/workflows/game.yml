name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *' # Menjalankan otomatis setiap hari jam 00:00 UTC
  workflow_dispatch:    # Memungkinkan trigger manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write       # Izin wajib untuk commit game.gif kembali ke repo

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2 # Penting: dibutuhkan oleh action untuk mengubah commit sebelumnya

      - name: Generate Space Shooter Game
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.webp'
          strategy: 'random' # Pola serangan musuh: column, row, random